<!doctype html>
<html lang="uk" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0057b7">
<title>Адмінка — Alex_bes😈</title>
<link rel="icon" type="image/png" href="img/favicon.png?v=3">
<link rel="stylesheet" href="css/style.css?v=18">
<link rel="stylesheet" href="css/admin.css?v=2">
</head>
<body class="admbody">
<div class="uastripe" aria-hidden="true"></div>
<header class="hdr">
  <div class="wrap hdr__in adm-hdr">
    <a class="brand" href="./" aria-label="На сайт">
      <img class="brand__logo" src="img/logo.webp?v=3" width="44" height="44" alt="Alex_bes">
      <span class="brand__txt"><span class="brand__name">⚙️ Адмінка</span><span class="brand__sub" id="adm-who">Alex_bes😈 — керування товарами</span></span>
    </a>
    <nav class="adm-hdr__nav">
      <a class="btn btn--o adm-sm" href="./" id="adm-site">← На сайт</a>
      <button class="btn btn--o adm-sm" type="button" id="adm-logout" hidden>Вийти</button>
    </nav>
  </div>
</header>

<main class="wrap adm">
  <section id="adm-gate" class="adm-card adm-gate">
    <p class="muted">Завантаження…</p>
  </section>

  <section id="adm-app" hidden>
    <div class="adm-tools">
      <input id="adm-q" type="search" placeholder="Пошук: назва, код, id…" autocomplete="off" aria-label="Пошук товарів">
      <select id="adm-cat" aria-label="Категорія"></select>
      <select id="adm-flt" aria-label="Фільтр">
        <option value="all">Усі товари</option>
        <option value="changed">Змінені в адмінці</option>
        <option value="new">Додані в адмінці</option>
        <option value="hidden">Приховані</option>
      </select>
      <button class="btn btn--y" type="button" id="adm-add">➕ Додати товар</button>
    </div>
    <p class="adm-stats" id="adm-stats"></p>
    <ul class="adm-list" id="adm-list"></ul>
  </section>
</main>

<div class="modal adm-modal" id="adm-edit" hidden>
  <div class="modal__bg" data-x></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="ed-ttl">
    <button class="modal__x" type="button" data-x aria-label="Закрити">✕</button>
    <form id="ed-form" class="ed" novalidate></form>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="data/products.js?v=22"></script>
<script src="js/media.js?v=1"></script>
<script type="module" src="js/admin.js?v=2"></script>
</body>
</html>
